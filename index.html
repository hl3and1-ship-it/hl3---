<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>deerma-manual-studio 平台化开发周期计划 · 多版本可编辑</title>
<style>
  :root{
    --bg:#0f1117; --panel:#161a23; --panel2:#1c2230; --line:#2a3142;
    --txt:#e6e9ef; --muted:#9aa3b2; --accent:#4f9dff; --accent2:#7c5cff;
    --green:#39d98a; --amber:#ffb454; --red:#ff6b6b; --cyan:#46d6e0;
    --p1:#4f9dff; --p2:#7c5cff; --p3:#39d98a; --it:#ffb454;
  }
  /* ============ 浅色主题 ============ */
  [data-theme="light"]{
    --bg:#eef1f6; --panel:#ffffff; --panel2:#e7ebf2; --line:#d2d9e4;
    --txt:#1a2030; --muted:#5b6473; --accent:#2b7fff; --accent2:#6a3ff0;
    --green:#1aa564; --amber:#c47d12; --red:#d83a3a; --cyan:#15808c;
    --p1:#2b7fff; --p2:#6a3ff0; --p3:#1aa564; --it:#c47d12;
  }
  [data-theme="light"] body{background:radial-gradient(1200px 600px at 70% -10%, #dfe6f3 0%, var(--bg) 55%)}
  [data-theme="light"] .banner{background:linear-gradient(90deg,rgba(106,63,240,.10),rgba(43,127,255,.04));
    border-color:#cdc6ec;border-left-color:var(--accent2)}
  [data-theme="light"] .banner b{color:#5b3fd6}
  [data-theme="light"] #hint{background:rgba(106,63,240,.10);border-color:#cdc6ec;color:#5b3fd6}
  [data-theme="light"] #toolbar{background:rgba(255,255,255,.92);border-color:var(--line);box-shadow:0 8px 30px rgba(0,0,0,.12)}
  [data-theme="light"] #toolbar button{color:var(--txt);background:var(--panel2)}
  [data-theme="light"] #toolbar button:hover{border-color:var(--accent);color:#04122b}
  [data-theme="light"] #toolbar button.primary{background:var(--accent);color:#fff}
  [data-theme="light"] #toolbar button.primary:hover{background:#1a6fe0}
  .theme-toggle{position:fixed;top:16px;right:16px;z-index:1000;
    font-family:inherit;font-size:13px;color:var(--txt);background:var(--panel);
    border:1px solid var(--line);border-radius:22px;padding:8px 14px;cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.18);transition:.15s;white-space:nowrap}
  .theme-toggle:hover{border-color:var(--accent);color:#fff}
  [data-theme="light"] .theme-toggle:hover{color:#04122b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 70% -10%, #1a2233 0%, var(--bg) 55%);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6; padding:0 0 100px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  /* Version selector */
  .verbar{margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .verbar label{font-size:13px;color:var(--muted)}
  .verbar select{
    background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;
    padding:8px 14px;font-size:14px;font-family:inherit;cursor:pointer;outline:none
  }
  .verbar select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,157,255,.25)}
  .verbar .newver{
    background:var(--panel2);color:var(--accent);border:1px dashed var(--line);border-radius:8px;
    padding:6px 12px;font-size:12px;cursor:pointer;transition:.15s
  }
  .verbar .newver:hover{border-color:var(--accent);background:rgba(79,157,255,.1)}
  .verbar .vstatus{margin-left:auto;font-size:12px;color:var(--muted)}

  /* Hero */
  header{padding:36px 0 36px}
  .tag{display:inline-block;font-size:12px;letter-spacing:1px;color:var(--accent);
    border:1px solid var(--line);background:var(--panel);padding:4px 12px;border-radius:30px;margin-bottom:10px}
  h1{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.25}
  h1 .v{color:var(--accent)}
  .sub{color:var(--muted);margin-top:12px;font-size:15px;max-width:760px}
  .banner{margin-top:24px;background:linear-gradient(90deg,rgba(124,92,255,.18),rgba(79,157,255,.06));
    border:1px solid #3a3f6b;border-left:4px solid var(--accent2);
    border-radius:12px;padding:16px 20px;font-size:14px}
  .banner b{color:#c9b8ff}

  /* Section */
  section{margin-top:48px}
  h2{font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:18px}
  h2 .n{width:30px;height:30px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);
    display:grid;place-items:center;font-size:14px;color:var(--accent)}

  /* Timeline weeks */
  .weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .week{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;overflow:hidden}
  .week::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--accent)}
  .week.w2::before{background:var(--accent)} .week.w3::before{background:var(--accent2)} .week.w4::before{background:var(--green)}
  .week .wk{font-size:12px;color:var(--muted);letter-spacing:1px}
  .week .t{font-weight:700;font-size:16px;margin:6px 0 10px}
  .week ul{list-style:none;font-size:13px;color:var(--muted)}
  .week ul li{padding:3px 0;border-top:1px dashed var(--line)}
  .week ul li:first-child{border-top:none}

  /* Phase cards */
  .phases{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;position:relative}
  .pcard.p1{border-top:3px solid var(--p1)} .pcard.p2{border-top:3px solid var(--p2)} .pcard.p3{border-top:3px solid var(--p3)}
  .pcard .ph{font-size:13px;font-weight:700;letter-spacing:1px}
  .pcard.p1 .ph{color:var(--p1)} .pcard.p2 .ph{color:var(--p2)} .pcard.p3 .ph{color:var(--p3)}
  .pcard .wk2{font-size:12px;color:var(--muted);margin:2px 0 14px}
  .pcard .goal{font-size:14px;font-weight:600;margin-bottom:10px}
  .pcard ul{list-style:none;font-size:13px;color:var(--muted)}
  .pcard ul li{padding:5px 0 5px 16px;position:relative}
  .pcard ul li::before{content:"";position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}

  /* Key finding callout */
  .finding{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;font-size:14px}
  .finding h3{font-size:15px;color:var(--cyan);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--txt)}
  .chip b{color:var(--accent)}
  .finding .arrow{margin-top:14px;color:var(--green);font-weight:600}

  /* Deliverables table */
  .dtable{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .dtable th,.dtable td{padding:13px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--line);vertical-align:top}
  .dtable th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.5px}
  .dtable tr:last-child td{border-bottom:none}
  .dtable td .id{width:24px;height:24px;border-radius:7px;background:var(--p1);color:#04122b;font-weight:800;display:grid;place-items:center;font-size:12px}
  .dtable b{color:var(--txt)}
  .dtable .ok{color:var(--green)}
  .dtable .who{color:var(--amber);font-size:12px}

  .judge{margin-top:16px;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--green);
    border-radius:10px;padding:14px 18px;font-size:13px;color:var(--muted)}
  .judge b{color:var(--green)}

  /* IT cards */
  .itgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .itcard{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 18px;display:flex;gap:14px}
  .itcard .num{font-size:20px;font-weight:800;color:var(--it);min-width:28px}
  .itcard .ct .t{font-weight:600;font-size:14px}
  .itcard .ct .d{font-size:12.5px;color:var(--muted);margin:4px 0}
  .itcard .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted);background:var(--panel2)}
  .badge.crit{color:var(--red);border-color:#5b2b2b}
  .badge.w1{color:var(--it);border-color:#5b4520}

  /* Gantt */
  .gantt{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 22px 14px}
  .ghead{display:grid;grid-template-columns:280px repeat(4,1fr);gap:8px;font-size:12px;color:var(--muted);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .ghead div{text-align:center}
  .ghead .lbl{text-align:left}
  .grow{display:grid;grid-template-columns:280px repeat(4,1fr);gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .grow:last-child{border-bottom:none}
  .grow .name{color:var(--txt);font-size:12.5px}
  .grow .name.it{color:var(--it)}
  .grow .name.big{font-weight:700}
  .cell{height:22px;border-radius:6px;background:transparent}
  .bar{height:22px;border-radius:6px}
  .bar.fill{width:100%}
  .bar.p1{background:linear-gradient(90deg,#4f9dff,#6fb4ff)}
  .bar.p2{background:linear-gradient(90deg,#7c5cff,#9b80ff)}
  .bar.p3{background:linear-gradient(90deg,#39d98a,#5fe6a4)}
  .bar.it{background:repeating-linear-gradient(90deg,#ffb454 0 14px,#ca8d3f 14px 18px)}

  /* Risks */
  .risks{display:grid;grid-template-columns:repeat(1,1fr);gap:12px}
  .risk{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 18px}
  .risk .dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex-shrink:0}
  .risk .dot.block{background:var(--red);box-shadow:0 0 0 4px rgba(255,107,107,.15)}
  .risk .dot.warn{background:var(--amber)}
  .risk .ct .t{font-weight:600;font-size:14px}
  .risk .ct .d{font-size:13px;color:var(--muted);margin-top:3px}
  .risk .ct .tag2{font-size:11px;color:var(--red);font-weight:600;margin-right:8px}

  footer{margin-top:50px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

  /* ============ EDITING LAYER ============ */
  [contenteditable="true"]{outline:none}
  body.edit [contenteditable="true"]{border-radius:6px;transition:background .15s,box-shadow .15s}
  body.edit [contenteditable="true"]:hover{background:rgba(79,157,255,.08);box-shadow:0 0 0 1px rgba(79,157,255,.25)}
  body.edit [contenteditable="true"]:focus{background:rgba(79,157,255,.12);box-shadow:0 0 0 2px var(--accent)}
  /* keep bars non-editable even inside editable wrap */
  .cell,.bar,.dot,.tag2,.n{contenteditable:false !important;user-select:none}

  #toolbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:999;
    display:flex;align-items:center;gap:8px;background:rgba(22,26,35,.92);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:40px;padding:8px 12px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  #toolbar button{font-family:inherit;font-size:13px;color:var(--txt);background:var(--panel2);
    border:1px solid var(--line);border-radius:22px;padding:8px 14px;cursor:pointer;transition:.15s;white-space:nowrap}
  #toolbar button:hover{border-color:var(--accent);color:#fff}
  #toolbar button.primary{background:var(--accent);border-color:var(--accent);color:#04122b;font-weight:700}
  #toolbar button.primary:hover{background:#6fb4ff}
  #toolbar .sep{width:1px;height:22px;background:var(--line)}
  #toolbar .status{font-size:12px;color:var(--muted);padding:0 4px;min-width:64px;text-align:center}
  #toolbar .status.saved{color:var(--green)}

  /* editable hint toast */
  #hint{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:999;
    background:rgba(124,92,255,.16);border:1px solid #3a3f6b;color:#c9b8ff;font-size:13px;
    padding:8px 16px;border-radius:30px;opacity:0;transition:opacity .3s;pointer-events:none}
  #hint.show{opacity:1}

  @media print{
    #toolbar,#hint,.verbar,#btnTheme{display:none !important}
    body{background:#fff;color:#111}
    .pcard,.week,.itcard,.risk,.finding,.dtable,.gantt{break-inside:avoid}
  }
  @media(max-width:820px){
    .weeks,.phases{grid-template-columns:1fr 1fr}
    .itgrid{grid-template-columns:1fr}
    .ghead,.grow{grid-template-columns:160px repeat(4,1fr)}
    #toolbar{flex-wrap:wrap;max-width:94vw;justify-content:center}
  }
</style>
</head>
<body class="edit">
<button id="btnTheme" class="theme-toggle" contenteditable="false" title="切换浅色 / 深色">🌙 深色</button>

<div class="wrap">
  <!-- 版本选择器（不可编辑） -->
  <div class="verbar" contenteditable="false">
    <label for="verSelect">📌 版本计划</label>
    <select id="verSelect"></select>
    <button class="newver" id="btnNewVer" title="复制当前版本生成新版本">+ 复制当前版本</button>
    <span class="vstatus" id="vstatus">当前：v2.0</span>
  </div>
</div>

<!-- 可编辑文档区 -->
<div class="wrap" id="doc" contenteditable="true">
  <!-- JS 按当前版本渲染 -->
</div>

<!-- 浮动编辑工具栏 -->
<div id="toolbar">
  <button id="btnToggle" class="primary">✏️ 编辑中</button>
  <div class="sep"></div>
  <button id="btnSave">💾 保存</button>
  <button id="btnExport">⬇️ 导出HTML</button>
  <button id="btnPdf">🖨 导出PDF</button>
  <button id="btnReset">↺ 重置</button>
  <div class="sep"></div>
  <div class="status" id="status">已自动保存</div>
</div>
<div id="hint">点击任意文字即可修改 · 自动保存到本机</div>

        {ph:"基线", color:"it", wk2:"版本锚点", goal:"v1.7（tag c1758d9）", items:["当前基线：v1.7","目标版本：v2.0","周期：1 个月 / 4 周","生成日期：2026-07-30"]}

  // ========== 版本切换与保存 ==========
  function populateSelector(){
    var old = verSelect.value;
    verSelect.innerHTML = '';
    Object.keys(store.versions).forEach(function(k){
      var opt = document.createElement('option');
      opt.value = k; opt.textContent = k;
      verSelect.appendChild(opt);
    });
    if(store.versions[old]) verSelect.value = old;
    else if(store.versions[store.current]) verSelect.value = store.current;
  }

  function syncDocToData(vkey){
    // 把当前 doc.innerHTML 写回对应版本（保留用户编辑）
    store.versions[vkey] = null; // 标记需要序列化后再存；这里直接保留 HTML 字符串
    // 实际这里简单处理：用 innerHTML 作为版本内容字符串存储
    // 但数据结构是对象，所以用一个 editedHtml 字段保存用户覆盖的 HTML
  }

  function saveStore(){
    try{
      localStorage.setItem(KEY, JSON.stringify(store));
      status.textContent = "已自动保存";
      status.classList.add("saved");
    }catch(e){ status.textContent = "保存失败"; }
  }

  function applyVersion(vkey){
    if(!store.versions[vkey]) return;
    // 切换前：仅当当前 doc 已渲染出有效内容才回存，避免用空白覆盖已保存内容
    if(doc.innerHTML && doc.innerHTML.replace(/\s/g,'').length > 50){
      store.edited[store.current] = doc.innerHTML;
    }
    store.current = vkey;
    // 加载：优先用 edited（需有足够长度，否则回退默认渲染）
    if(store.edited[vkey] && store.edited[vkey].replace(/\s/g,'').length > 50){
      doc.innerHTML = store.edited[vkey];
    }else{
      doc.innerHTML = renderVer(vkey);
    }
    verSelect.value = vkey;
    vstatus.textContent = "当前：" + vkey;
    saveStore();
  }

  // 输入监听：把当前 innerHTML 保存到 edited[current]
  var t;
  function scheduleSave(){
    status.textContent = "编辑中…"; status.classList.remove("saved");
    clearTimeout(t);
    t = setTimeout(function(){
      store.edited[store.current] = doc.innerHTML;
      saveStore();
    }, 600);
  }
  doc.addEventListener("input", scheduleSave);

  verSelect.addEventListener("change", function(){ applyVersion(verSelect.value); });

  // 新建版本：复制当前版本数据
  btnNewVer.addEventListener("click", function(){
    var base = store.current;
    var keys = Object.keys(store.versions).sort();
    // 找到下一个版本号 v2.x
    var max = 2;
    keys.forEach(function(k){
      var m = k.match(/^v(\d+)\.(\d+)$/);
      if(m){ var major = parseInt(m[1]), minor = parseInt(m[2]); if(major>max) max=major*1000+minor; }
    });
    var nextMajor = 2, nextMinor = 1;
    // 简单递增 minor
    var nums = keys.filter(function(k){ return k.indexOf('v2.')===0; }).map(function(k){ return parseInt(k.split('.')[1])||0; });
    nextMinor = Math.max.apply(null, nums) + 1;
    var newKey = "v2." + nextMinor;
    store.versions[newKey] = JSON.parse(JSON.stringify(store.versions[base]));
    // 继承 editedHtml 如果有
    store.edited[newKey] = store.edited[base] ? store.edited[base] : renderVer(newKey);
    // 修改标题里的版本号（如果内容还没被用户大量编辑）
    store.edited[newKey] = store.edited[newKey].replace(/v\d+\.\d+ → v\d+\.\d+/g, function(m){
      return m.replace(/→ v\d+\.\d+/, "→ "+newKey);
    });
    populateSelector();
    applyVersion(newKey);
    saveStore();
  });

  // 初始化
  populateSelector();
  applyVersion(store.current);

  function applyTheme(th){
    document.documentElement.setAttribute("data-theme", th);
    if(btnTheme) btnTheme.textContent = (th === "light") ? "☀️ 浅色" : "🌙 深色";
    try{ localStorage.setItem(THEME_KEY, th); }catch(e){}
  }
  var savedTheme = "dark";
  try{ savedTheme = localStorage.getItem(THEME_KEY) || "dark"; }catch(e){}
  applyTheme(savedTheme);
  if(btnTheme) btnTheme.addEventListener("click", function(){
    var cur = (document.documentElement.getAttribute("data-theme") === "light") ? "dark" : "light";
    applyTheme(cur);
  });

  document.getElementById("btnSave").addEventListener("click", function(){
    store.edited[store.current] = doc.innerHTML;
    saveStore();
  });

  document.getElementById("btnExport").addEventListener("click", function(){
    var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    var blob = new Blob([html], {type:"text/html;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "开发周期计划_多版本可编辑.html";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  document.getElementById("btnPdf").addEventListener("click", function(){ window.print(); });

  document.getElementById("btnReset").addEventListener("click", function(){
    if(confirm("确认重置为初始内容？所有版本的本地修改将丢失。")){
      localStorage.removeItem(KEY);
      location.reload();
    }
  });
})();
</script>
</body>
</html>
